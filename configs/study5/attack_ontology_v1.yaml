estimands:
  family_conditioned_binary_recall:
    identifier: FAMILY_CONDITIONED_BINARY_RECALL
    numerator: TRUE_FAMILY_ATTACKS_WITH_BINARY_SCORE_AT_OR_ABOVE_FROZEN_THRESHOLD
    denominator: TRUE_FAMILY_ATTACKS
    task: BINARY_DETECTION
    is_attribution_evidence: false

  support:
    minimum_evaluation_support: 50
    comparison: GREATER_THAN_OR_EQUAL
    unit: UNIQUE_PHYSICAL_EVALUATION_SLICE
    forbidden_pooling:
      - METHODS
      - SEEDS
      - REPEATED_EVALUATIONS_OF_IDENTICAL_ROWS
      - DOMAINS
      - ZERO_SUPPORT_SLICES
      - DISTINCT_UNMAPPED_NATIVE_LABELS
    paired_methods_share_eligible_set: true
    low_nonzero_support: DESCRIPTIVE_ONLY
    zero_support: UNAVAILABLE_NOT_ZERO

  novelty:
    assignment: DOMAIN_ENTRY
    prior_history_sources:
      - SOURCE_INITIAL_TRAINING
      - SOURCE_VALIDATION
      - COMPLETED_EARLIER_ONLINE_DOMAIN
    forbidden_history_sources:
      - CURRENT_DOMAIN_FUTURE_WINDOWS
      - FUTURE_DOMAINS
      - PERMANENT_HOLDOUTS
    retain_status_through_domain: true
    family_label_available_before_prediction_field: family_label_available_before_prediction
    label_availability_sources:
      - LEGITIMATE_SOURCE_EXPOSURE
      - RELEASED_DELAYED_SUPERVISION
    label_availability_is_model_knowledge: false
    unmapped_semantic_novelty: NOT_APPLICABLE

  hidden_family_failure:
    identifier: HIDDEN_FAMILY_FAILURE_PRIMARY
    aggregate_loss_operator: LESS_THAN_OR_EQUAL
    aggregate_loss_limit: 0.10
    family_loss_operator: GREATER_THAN
    family_loss_limit: 0.10
    family_scope: SUPPORTED_FAMILIES
    logic: AND

  learned_references:
    study1:
      source_learned_reference: SOURCE_INITIAL_PERMANENT_HOLDOUT_EVALUATION
    study2:
      source_learned_reference: source_initial
      later_domain_learned_reference: post_adapt
      final_reference: final
      pre_adapt_in_learned_maximum: false
      exclude_final_domain_from_aggregate_forgetting: true
    study4:
      source_learned_reference: source_initial
      later_domain_event: post_accept
      later_domain_event_selection: FINAL_EVENT_CAUSED_BY_LEGITIMATELY_RELEASED_EVIDENCE_FROM_SAME_DOMAIN
      no_accepted_update: NOT_LEARNED_NO_UPDATE
      preserved_nonlearned_reference: domain_end
      domain_end_is_learned: false

  family_forgetting:
    definition: MAX_RECALL_AT_OR_AFTER_LEARNED_MINUS_FINAL_RECALL
    learned_time_inclusive: true
    persist_fields: [learned_recall, maximum_recall, final_recall, forgetting]

  supported_summaries:
    macro: UNWEIGHTED_MEAN_SUPPORTED_FAMILY_RECALL
    worst: MINIMUM_SUPPORTED_FAMILY_RECALL
    persist_arg_min_family: true
    persist_all_arg_min_ties: true
    interval: WILSON_95_PERCENT
    wilson_z: 1.95996398454

hypothesis_scope:
  H6: NOT_CURRENTLY_TESTABLE
  H7: PARTIALLY_TESTABLE_EXISTING_SINGLE_ORDER
  H8: NOT_CURRENTLY_TESTABLE

reporting_strata:
  values:
    - PREQUENTIAL_ONLINE_STREAM_FAMILY_DETECTION
    - PERMANENT_HOLDOUT_FAMILY_RETENTION
  pooling_across_strata: false
