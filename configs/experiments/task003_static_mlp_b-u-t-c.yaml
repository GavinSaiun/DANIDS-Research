experiment_id: E1_STATIC_MLP_B-U-T-C_s42
study: E1
seed: 42

datasets:
  sequence: [B, U, T, C]
  split_version: task001-v1

stream:
  window_size: 50000
  boundary_mode: task_free

splits:
  initial:
    train: 0.60
    validation: 0.20
    holdout: 0.20
  later:
    online: 0.80
    holdout: 0.20

operating_envelope:
  target_fpr: 0.001

model:
  name: static_mlp
  hidden_dimensions: [256, 128, 64]
  dropout: 0.20

training:
  loss: BCEWithLogitsLoss
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 2048
  evaluation_batch_size: 8192
  maximum_epochs: 30
  early_stopping_patience: 5
  early_stopping_metric: validation_pr_auc
  minimum_improvement: 0.0
  shuffle_training: true

materialization:
  cache_root: data/materialized
  csv_chunk_rows: 100000
