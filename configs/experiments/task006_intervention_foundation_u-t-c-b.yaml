experiment_id: E4_FOUNDATION_U-T-C-B_s42
study: E4
seed: 42

datasets:
  sequence: [U, T, C, B]
  split_version: task001-v1

stream:
  window_size: 50000
  boundary_mode: task_free

splits:
  initial:
    train: 0.60
    validation: 0.20
    holdout: 0.20
  later:
    online: 0.80
    holdout: 0.20

actions:
  ordering:
    - A0_NO_OP
    - A1_RECALIBRATE
    - A2_HEAD_UPDATE
    - A3_FULL_FINE_TUNE
    - A4_REPLAY_UPDATE

supervision:
  label_budget_per_later_domain: 100
  label_delay_windows: 1

operating_envelope:
  target_fpr: 0.001
  alpha: 0.001
  recall_loss_tolerance: 0.10
  forgetting_tolerance: 0.10
  confidence: 0.95

adaptation:
  optimizer: AdamW
  learning_rate: 0.0001
  weight_decay: 0.0001
  batch_size: 64
  epochs: 20

memory:
  replay_per_domain: 400
  audit_per_domain: 100
