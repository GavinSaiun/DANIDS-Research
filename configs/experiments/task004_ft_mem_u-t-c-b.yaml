experiment_id: E2_FTMEM_U-T-C-B_B100_D1_s42
study: E2
seed: 42

datasets:
  sequence: [U, T, C, B]
  split_version: task001-v1

stream:
  window_size: 50000
  boundary_mode: boundary_aware_control

splits:
  initial:
    train: 0.60
    validation: 0.20
    holdout: 0.20
  later:
    online: 0.80
    holdout: 0.20

supervision:
  label_budget_per_later_domain: 100
  label_delay_windows: 1
  schedule: first_window_uniform

operating_envelope:
  target_fpr: 0.001

adaptation:
  method: ft_mem
  optimizer: AdamW
  learning_rate: 0.0001
  weight_decay: 0.0001
  batch_size: 64
  epochs: 20
  ewc_lambda: 100.0

memory:
  replay_per_domain: 400
  audit_per_domain: 0

materialization:
  cache_root: data/materialized
  csv_chunk_rows: 100000
