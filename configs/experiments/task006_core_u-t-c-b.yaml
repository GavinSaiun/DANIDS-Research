experiment_id: E4_CORE_U-T-C-B_s42
study: E4
seed: 42

datasets:
  sequence: [U, T, C, B]
  split_version: task001-v1

stream:
  window_size: 50000
  boundary_mode: task_free

splits:
  initial:
    train: 0.60
    validation: 0.20
    holdout: 0.20
  later:
    online: 0.80
    holdout: 0.20

actions:
  ordering:
    - A0_NO_OP
    - A1_RECALIBRATE
    - A2_HEAD_UPDATE
    - A3_FULL_FINE_TUNE
    - A4_REPLAY_UPDATE
  normal_escalation:
    - A2_HEAD_UPDATE
    - A4_REPLAY_UPDATE
  a1_preflight_reason: INFEASIBLE_INSUFFICIENT_BENIGN_SUPPORT
  a1_minimum_benign_support: 3838
  a3_core_selectable: false

supervision:
  label_budget_per_later_domain: 100
  label_delay_windows: 1
  query_batch_size: 25
  maximum_query_events: 4
  maximum_pending_queries: 1
  maximum_queries_per_window: 1
  selector_version: task006-sha256-label-blind-v1
  query_states: [PREDICTED_UNCERTAIN, PREDICTED_HARMFUL]
  cancel_pending_on_safe: false
  allow_partial_query: false

allocation:
  replay_per_release: 20
  audit_per_release: 5
  source_replay_capacity: 400
  source_audit_capacity: 100
  later_replay_capacity: 400
  later_audit_capacity: 100
  selection: deterministic_binary_stratified
  current_scope_audit_eligible: false
  activate_when_historical: true

operating_envelope:
  target_fpr: 0.001
  alpha: 0.001
  recall_loss_tolerance: 0.10
  forgetting_tolerance: 0.10
  confidence: 0.95

adaptation:
  optimizer: AdamW
  learning_rate: 0.0001
  weight_decay: 0.0001
  batch_size: 64
  epochs: 20

health:
  feature_set: combined_unlabelled
  predictor: gradient_boosting
  feature_contract:
    - dist_covariance_relative_frobenius
    - dist_domain_classifier_auroc
    - dist_mmd2_linear_rbf
    - dist_wasserstein_max
    - dist_wasserstein_mean
    - dist_wasserstein_median
    - dist_wasserstein_p90
    - model_score_mean
    - model_score_std
    - model_score_p01
    - model_score_p05
    - model_score_p50
    - model_score_p95
    - model_score_p99
    - model_predicted_attack_rate
    - model_predicted_attack_rate_change
    - model_score_wasserstein
    - model_entropy_mean
    - model_entropy_p90
    - model_confidence_mean
    - model_confidence_below_060
    - model_confidence_below_075
    - model_embedding_centroid_l2
    - model_embedding_covariance_relative_frobenius
    - model_conformal_non_singleton_rate
    - model_conformal_empty_rate
    - model_conformal_two_class_rate
    - model_conformal_mean_set_size
  imputer_strategy: median
  imputer_add_indicator: true
  imputer_keep_empty_features: true
  scaler: StandardScaler
  boosting_estimators: 100
  boosting_learning_rate: 0.05
  boosting_max_depth: 2
  boosting_random_state: 42
  tau_safe: 0.9018519135061515
  tau_harmful: 0.996204779436253
  calibration_rule: strategy_c_closed_benchmark_v1
  grouping_version: task006-overlap-component-v1
  scientific_status: prospectively_frozen_closed_core_benchmark
  predicted_safe_is_certified_safety: false

references:
  semantics: fixed_data_current_model
  source_initial_train_rows: 4096
  source_validation: complete
  immutable_distribution_reference: true
  immutable_original_recall_reference: true
  update_model_dependent_after_acceptance_only: true

incident_reset:
  require_fresh_predicted_safe: true
  reject_if_any_historical_audit_harmful: true
  uncertain_is_no_demonstrated_harm: true
  missing_audit_coverage_is_logged: true

information_boundary:
  strict_typed_feature_allowlist: true
  offline_health_truth_visible: false
  complete_window_labels_visible: false
  domain_identity_visible: false
  transition_visible: false
  permanent_holdouts_visible: false
