[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danids-research"
version = "0.1.0"
description = "Leakage-safe sequential benchmark infrastructure for DANIDS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "All rights reserved" }
authors = [{ name = "DANIDS Research" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pandas-stubs>=2.1",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0",
]

[project.scripts]
danids = "danids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
danids = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["danids"]
show_error_codes = true
warn_unreachable = true
